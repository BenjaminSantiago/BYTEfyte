<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Rive Test</title>

        <style>
            html,
            body {
                margin: 0;
                height: 100%;
            }

            canvas {
                width: 600px;
                height: 400px;
            }
        </style>
    </head>

    <body>
        <canvas id="riveCanvas"></canvas>

        <script src="https://unpkg.com/@rive-app/canvas"></script>

        <script>
            const canvas = document.getElementById("riveCanvas");
            let buttonVALUE;
            

            const animation = new rive.Rive({
                src: "./bytebutton__test.riv",
                canvas: canvas,

                artboard: "Artboard",
                stateMachines: " button",

                autoplay: true,
                autoBind: true,

                onLoad: () => {
                    animation.resizeDrawingSurfaceToCanvas();

                    console.log("Artboards:", animation.artboardNames);
                    console.log("State machines:", animation.stateMachineNames);

                    const viewModel    = animation.viewModelInstance;
                          pressTrigger = viewModel.trigger("press");
                          buttonVALUE  = viewModel.number("buttonVALUE");

                    console.log(pressTrigger);
                },

                onLoadError: console.error
            });


            window.addEventListener("keypress", (e) =>
            {
                if(e.key.toLowerCase() == 'a' && !event.repeat)
                {
                    pressTrigger?.trigger();
                    buttonVALUE.value = 1 - buttonVALUE.value;
                }
            });

        </script>
    </body>
</html>
